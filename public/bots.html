<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Bots - AI Assistant</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-hover: #f5f6f8;
  --text: #202124;
  --muted: #858b98;
  --border: #eceef1;
  --accent: #526bea;
  --accent-light: #eef0ff;
  --shadow: 0 12px 35px rgba(25,35,60,.10);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, "Noto Sans JP", sans-serif;
  overflow: hidden;
}

button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid rgba(82,107,234,.3); outline-offset: 3px; }

.app {
  display: flex;
  width: 100%;
  height: 100dvh;
  animation: appAppear .65s cubic-bezier(.16,1,.3,1);
}

@keyframes appAppear { from { opacity: 0; } to { opacity: 1; } }

/* Sidebar */

.sidebar {
  width: 255px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 22px 15px;
  background: #fff;
  transition: transform .35s cubic-bezier(.16,1,.3,1);
  z-index: 30;
}

.brand { display: flex; align-items: center; padding: 2px 9px 30px; }
.brand-name { font-size: 21px; font-weight: 500; letter-spacing: -.8px; color: #202124; }
.brand-name span { color: var(--accent); }

.new-chat {
  border: 1px solid var(--border);
  background: #fff;
  color: #424753;
  padding: 11px 13px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 11px;
  font-size: 12px;
  font-weight: 500;
  transition: .25s cubic-bezier(.16,1,.3,1);
}
.new-chat i { font-size: 13px; color: var(--accent); transition: transform .3s; }
.new-chat:hover { background: #f8f9ff; border-color: #dce1ff; transform: translateY(-1px); }
.new-chat:hover i { transform: rotate(90deg); }
.new-chat:active { transform: scale(.98); }

.side-label {
  font-size: 10px;
  font-weight: 600;
  color: #a0a5b0;
  margin: 28px 10px 12px;
  letter-spacing: .7px;
}

.history-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 12px;
  font-size: 12px;
  color: #646a76;
  border-radius: 9px;
  cursor: pointer;
  transition: background .22s, color .22s, transform .22s;
}
.history-item:hover { background: #f3f4f7; color: #252a34; transform: translateX(3px); }
.history-item.active { background: #f3f4f7; color: #252a34; }
.history-item i { width: 15px; text-align: center; font-size: 13px; }

.sidebar-bottom { margin-top: auto; }

.user-profile {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 7px;
  border-top: 1px solid var(--border);
}

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #e9edff;
  color: #526bea;
  font-size: 13px;
  font-weight: 600;
}

.user-name { font-size: 12px; font-weight: 600; }
.user-status { color: var(--muted); font-size: 10px; margin-top: 3px; }

/* Sidebar overlay */

.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(25,30,45,.25);
  backdrop-filter: blur(2px);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  z-index: 25;
  transition: opacity .3s, visibility .3s;
}
.sidebar-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }

/* Main */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
}

.topbar {
  height: 67px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  flex-shrink: 0;
  background: rgba(255,255,255,.96);
  z-index: 5;
  animation: topbarIn .5s ease both;
}

@keyframes topbarIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

.top-left { display: flex; align-items: center; gap: 12px; }
.page-name { font-size: 14px; font-weight: 600; }

.model-tag {
  font-size: 10px;
  color: var(--accent);
  background: var(--accent-light);
  padding: 5px 9px;
  border-radius: 20px;
  font-weight: 600;
}

.top-actions { display: flex; align-items: center; gap: 7px; }

.icon-btn {
  width: 37px;
  height: 37px;
  border: none;
  background: transparent;
  border-radius: 10px;
  color: #656b78;
  display: grid;
  place-items: center;
  font-size: 14px;
  transition: background .2s, color .2s, transform .25s;
}
.icon-btn:hover, .icon-btn.selected { background: var(--surface-hover); color: var(--accent); }
.icon-btn:active { transform: scale(.88); }
.icon-btn i { transition: transform .3s; }
.icon-btn:hover i { transform: scale(1.1); }

.mobile-menu { display: none; }

/* Settings dropdown */

.settings-wrap { position: relative; }

.settings-dropdown {
  position: absolute;
  right: 0;
  top: 48px;
  width: 255px;
  background: white;
  border: 1px solid #eceef2;
  border-radius: 15px;
  padding: 8px;
  box-shadow: var(--shadow);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(-14px) scale(.96);
  transform-origin: top right;
  transition: opacity .2s ease, transform .3s cubic-bezier(.16,1,.3,1), visibility .2s;
  z-index: 100;
}
.settings-dropdown.open { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0) scale(1); }

.dropdown-heading { padding: 10px 11px 8px; color: #9ba0aa; font-size: 10px; font-weight: 600; letter-spacing: .5px; }

.dropdown-item {
  display: flex;
  align-items: center;
  width: 100%;
  gap: 12px;
  padding: 11px;
  border: none;
  border-radius: 9px;
  background: transparent;
  text-align: left;
  color: #444b58;
  font-size: 12px;
  transition: background .2s, color .2s, transform .2s;
}
.dropdown-item:hover { background: #f4f5f9; color: var(--accent); transform: translateX(3px); }
.dropdown-item i { width: 17px; text-align: center; color: #858b99; font-size: 13px; transition: color .2s, transform .25s; }
.dropdown-item:hover i { color: var(--accent); transform: scale(1.12); }

.dropdown-divider { height: 1px; background: var(--border); margin: 6px 4px; }

/* Chat */

.chat-area {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px 20px;
  scroll-behavior: smooth;
}

.chat-content { width: 100%; max-width: 760px; flex: 1; display: flex; flex-direction: column; }

/* Welcome */

.welcome {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px 10px 60px;
  animation: welcomeIn .85s cubic-bezier(.16,1,.3,1) both;
}

.welcome h1 { font-size: clamp(25px, 4vw, 34px); letter-spacing: -1.3px; margin: 0; font-weight: 500; color: #30333b; }

@keyframes welcomeIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

.welcome.hide { animation: welcomeOut .3s ease forwards; pointer-events: none; }
@keyframes welcomeOut { to { opacity: 0; transform: translateY(-12px); } }

/* Messages */

.messages { display: flex; flex-direction: column; gap: 25px; padding: 15px 0 35px; }

.message { display: flex; gap: 12px; animation: messageIn .45s cubic-bezier(.16,1,.3,1) both; }
.message.user { justify-content: flex-end; }

.message-icon {
  flex-shrink: 0;
  width: 31px;
  height: 31px;
  border-radius: 10px;
  background: var(--accent-light);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-size: 13px;
}

.message-body {
  max-width: 82%;
  font-size: 13px;
  line-height: 1.9;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.message.user .message-body {
  background: #f0f2f7;
  border-radius: 15px 4px 15px 15px;
  padding: 11px 15px;
  animation: bubbleIn .3s cubic-bezier(.16,1,.3,1);
}

.message.bot .message-body { padding-top: 3px; }
.message.bot .message-body strong { font-size: 11px; display: block; margin-bottom: 7px; }
.message.error .message-body { color: #b42318; }

@keyframes messageIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes bubbleIn { from { transform: scale(.94); } to { transform: scale(1); } }

.typing { color: var(--muted); }
.typing::after { content: "…"; animation: dots 1.2s steps(4, end) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

/* Input section */

.input-section {
  width: 100%;
  max-width: 760px;
  padding: 15px 0 10px;
  background: white;
  position: sticky;
  bottom: 0;
  animation: inputIn .7s .1s cubic-bezier(.16,1,.3,1) both;
}

@keyframes inputIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

.input-box {
  border: 1px solid #e6e8ed;
  border-radius: 16px;
  padding: 5px 11px;
  box-shadow: 0 3px 15px rgba(30,40,70,.035);
  transition: border-color .3s, box-shadow .35s, border-radius .35s, padding .35s cubic-bezier(.16,1,.3,1), transform .35s cubic-bezier(.16,1,.3,1);
}
.input-box:focus-within { border-color: #c5cdfb; box-shadow: 0 6px 25px rgba(82,107,234,.07); }
.input-box.has-content {
  padding: 10px 15px 9px;
  border-radius: 19px;
  box-shadow: 0 7px 25px rgba(30,40,70,.065);
  transform: translateY(-2px);
}

.input-box textarea {
  display: block;
  width: 100%;
  resize: none;
  border: none;
  outline: none;
  font-family: inherit;
  font-size: 13px;
  color: var(--text);
  min-height: 25px;
  max-height: 150px;
  background: transparent;
  line-height: 1.7;
  padding: 2px 0;
  transition: min-height .3s;
}
.input-box.has-content textarea { min-height: 50px; }
.input-box textarea::placeholder { color: #a5aab4; }
.input-box textarea:disabled { opacity: .6; }

.input-bottom { display: flex; align-items: center; justify-content: flex-end; margin-top: 2px; transition: margin .3s; }
.input-box.has-content .input-bottom { margin-top: 7px; }

/* Send button */

.send-btn {
  width: 33px;
  height: 33px;
  border: none;
  border-radius: 10px;
  color: white;
  background: var(--accent);
  display: grid;
  place-items: center;
  font-size: 13px;
  transition: background .2s, transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s;
}
.send-btn:hover { background: #4059d7; transform: translateY(-2px); box-shadow: 0 5px 12px rgba(82,107,234,.23); }
.send-btn:active { transform: scale(.9); }
.send-btn:disabled { background: #b9c3f5; cursor: default; transform: none; box-shadow: none; }
.send-btn i { transition: transform .3s; }
.send-btn:hover i { transform: translateY(-2px); }

.input-caption { text-align: center; color: #a5aab4; font-size: 10px; padding: 11px 0 0; }

/* Link notice (SoraChat連携) */

.link-badge {
  font-size: 10px;
  color: #1f7a4d;
  background: #e8f7ef;
  padding: 5px 9px;
  border-radius: 20px;
  font-weight: 600;
  display: none;
}
.link-badge.on { display: inline-block; }

/* Toggle switch */

.switch { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; margin-left: auto; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute;
  inset: 0;
  background: #d5d9e2;
  border-radius: 20px;
  transition: background .25s;
}
.slider::before {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  left: 2px;
  top: 2px;
  background: #fff;
  border-radius: 50%;
  transition: transform .25s;
}
.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::before { transform: translateX(16px); }

.dropdown-item.row { cursor: default; }
.dropdown-item.row:hover { transform: none; background: transparent; color: #444b58; }

/* Scrollbar */

.chat-area::-webkit-scrollbar { width: 5px; }
.chat-area::-webkit-scrollbar-thumb { background: transparent; border-radius: 10px; }
.chat-area:hover::-webkit-scrollbar-thumb { background: #e1e4eb; }

/* Mobile */

@media (max-width: 700px) {
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: 260px;
    transform: translateX(-105%);
    box-shadow: none;
  }
  .sidebar.mobile-open { transform: translateX(0); box-shadow: 10px 0 35px rgba(0,0,0,.1); }
  .mobile-menu { display: grid; }
  .topbar { padding: 0 14px; height: 60px; }
  .chat-area { padding: 15px 15px; }
  .welcome { padding: 20px 10px 60px; }
  .welcome h1 { font-size: 26px; }
  .input-section { padding-bottom: 7px; }
  .settings-dropdown { width: min(255px, calc(100vw - 25px)); }
  .input-box.has-content { padding: 10px 13px 9px; }
}

@media (max-width: 380px) {
  .page-name { font-size: 13px; }
  .model-tag { font-size: 9px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-name">Bots<span>.</span></div>
    </div>

    <button class="new-chat" onclick="newChat()">
      <i class="fa-solid fa-plus"></i>
      新しいチャット
    </button>

    <div class="side-label">WORKSPACE</div>

    <div class="history-item active">
      <i class="fa-regular fa-comments"></i>
      AIチャット
    </div>

    <div class="sidebar-bottom">
      <div class="user-profile">
        <div class="avatar">B</div>
        <div>
          <div class="user-name">Bots</div>
          <div class="user-status" id="linkStatus">SoraChat 未連携</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <main class="main">

    <header class="topbar">
      <div class="top-left">
        <button class="icon-btn mobile-menu" onclick="toggleSidebar()" aria-label="メニュー">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="page-name">AI Chat</div>
        <div class="model-tag">Bots AI</div>
        <div class="link-badge" id="linkBadge">SoraChat 連携中</div>
      </div>

      <div class="top-actions">
        <button class="icon-btn" title="新しいチャット" aria-label="新しいチャット" onclick="newChat()">
          <i class="fa-regular fa-pen-to-square"></i>
        </button>

        <div class="settings-wrap">
          <button class="icon-btn" id="settingsButton" title="設定" aria-label="設定"
                  aria-expanded="false" aria-controls="settingsDropdown" onclick="toggleSettings()">
            <i class="fa-solid fa-sliders"></i>
          </button>

          <div class="settings-dropdown" id="settingsDropdown">
            <div class="dropdown-heading">PREFERENCES</div>

            <div class="dropdown-item row">
              <i class="fa-solid fa-plug"></i>
              SoraChat と連携
              <label class="switch">
                <input type="checkbox" id="linkToggle" onchange="setSoraChatLink(this.checked)">
                <span class="slider"></span>
              </label>
            </div>

            <div class="dropdown-divider"></div>
            <div class="dropdown-heading">ACCOUNT</div>

            <button class="dropdown-item" onclick="selectMenu('ヘルプ')">
              <i class="fa-regular fa-circle-question"></i>
              ヘルプ
            </button>
          </div>
        </div>
      </div>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="chat-content">
        <div class="welcome" id="welcome">
          <h1>今日は何をしますか？</h1>
        </div>
        <div class="messages" id="messages"></div>
      </div>

      <div class="input-section">
        <div class="input-box" id="inputBox">
          <textarea id="prompt" rows="1"
                    placeholder="Botsに何をしてほしいですか？"
                    onkeydown="handleKey(event)"
                    oninput="resizeInput(this)"></textarea>
          <div class="input-bottom">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="送信">
              <i class="fa-solid fa-arrow-up"></i>
            </button>
          </div>
        </div>
        <div class="input-caption">
          Bots AI can make mistakes. 投資など重要な判断は、ご自身で確認してください。
        </div>
      </div>
    </section>
  </main>
</div>

<script>
const settingsButton = document.getElementById('settingsButton');
const settingsDropdown = document.getElementById('settingsDropdown');
const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');
const promptInput = document.getElementById('prompt');
const messages = document.getElementById('messages');
const welcome = document.getElementById('welcome');
const chatArea = document.getElementById('chatArea');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');
const linkToggle = document.getElementById('linkToggle');
const linkBadge = document.getElementById('linkBadge');
const linkStatus = document.getElementById('linkStatus');

let botHistory = [];
let busy = false;

/* Settings */

function toggleSettings() {
  const opened = settingsDropdown.classList.toggle('open');
  settingsButton.classList.toggle('selected', opened);
  settingsButton.setAttribute('aria-expanded', String(opened));
}

function closeSettings() {
  settingsDropdown.classList.remove('open');
  settingsButton.classList.remove('selected');
  settingsButton.setAttribute('aria-expanded', 'false');
}

document.addEventListener('click', function (e) {
  if (!e.target.closest('.settings-wrap')) closeSettings();
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    closeSettings();
    closeSidebar();
  }
});

function selectMenu(name) {
  closeSettings();
  alert(name + ' を選択しました。');
}

/* SoraChat link */

function applyLinkState(allowed) {
  linkToggle.checked = allowed;
  linkBadge.classList.toggle('on', allowed);
  linkStatus.textContent = allowed ? 'SoraChat 連携中' : 'SoraChat 未連携';
}

async function loadLinkState() {
  try {
    const res = await fetch('/api/bots/link', { credentials: 'same-origin' });
    if (!res.ok) return;
    const data = await res.json();
    applyLinkState(data.allowed === true);
  } catch (_) {
    /* 読めなくても会話はできる */
  }
}

async function setSoraChatLink(allowed) {
  try {
    const res = await fetch('/api/bots/link', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ allowed })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '連携の設定を保存できませんでした。');
    applyLinkState(data.allowed === true);
  } catch (e) {
    applyLinkState(!allowed);
    alert(e.message);
  }
}

/* Sidebar */

function toggleSidebar() {
  if (sidebar.classList.contains('mobile-open')) closeSidebar();
  else openSidebar();
}

function openSidebar() {
  sidebar.classList.add('mobile-open');
  sidebarOverlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeSidebar() {
  sidebar.classList.remove('mobile-open');
  sidebarOverlay.classList.remove('active');
  document.body.style.overflow = '';
}

/* Input */

function resizeInput(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
  inputBox.classList.toggle('has-content', el.value.trim().length > 0);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendMessage();
  }
}

/* Messages（textContent で入れるので、AIの返答に含まれるHTMLは表示されない） */

function addMessage(text, type) {
  const message = document.createElement('div');
  message.className = 'message ' + type;

  if (type === 'user') {
    const body = document.createElement('div');
    body.className = 'message-body';
    body.textContent = text;
    message.appendChild(body);
  } else {
    const icon = document.createElement('div');
    icon.className = 'message-icon';
    icon.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i>';

    const body = document.createElement('div');
    body.className = 'message-body';

    const name = document.createElement('strong');
    name.textContent = 'Bots AI';

    const content = document.createElement('div');
    content.textContent = text;

    body.append(name, content);
    message.append(icon, body);
    if (type === 'error') message.classList.add('error');
  }

  messages.appendChild(message);
  requestAnimationFrame(() => {
    chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
  });
  return message;
}

function setBusy(on) {
  busy = on;
  sendBtn.disabled = on;
  promptInput.disabled = on;
}

/* Send */

async function sendMessage() {
  if (busy) return;
  const text = promptInput.value.trim();
  if (!text) return;

  if (!welcome.classList.contains('hide')) {
    welcome.classList.add('hide');
    setTimeout(() => { welcome.style.display = 'none'; }, 300);
  }

  addMessage(text, 'user');
  promptInput.value = '';
  promptInput.style.height = 'auto';
  inputBox.classList.remove('has-content');

  const pending = addMessage('考えています', 'bot');
  const pendingBody = pending.querySelector('.message-body > div');
  pendingBody.classList.add('typing');
  pendingBody.textContent = '';

  setBusy(true);
  try {
    const res = await fetch('/api/bots/chat', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ message: text, history: botHistory.slice(-10) })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || '応答できませんでした。');

    botHistory.push({ role: 'user', content: text }, { role: 'assistant', content: data.reply });
    pending.remove();
    addMessage(data.reply, 'bot');
    if (typeof data.linked === 'boolean') applyLinkState(data.linked);
  } catch (e) {
    pending.remove();
    addMessage(e.message || '応答できませんでした。', 'error');
  } finally {
    setBusy(false);
    promptInput.focus();
  }
}

/* New chat */

function newChat() {
  messages.innerHTML = '';
  botHistory = [];

  welcome.style.display = '';
  welcome.classList.remove('hide');

  promptInput.value = '';
  promptInput.style.height = 'auto';
  inputBox.classList.remove('has-content');

  closeSettings();
  closeSidebar();

  chatArea.scrollTo({ top: 0, behavior: 'smooth' });
}

loadLinkState();
</script>
