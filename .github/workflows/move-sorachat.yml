name: Move sorachat Contents to Root and Push

on:
  workflow_dispatch:
  push:
    paths:
      - 'sorachat/**'

permissions:
  contents: write

jobs:
  move-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Gitユーザー情報のセットアップ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: sorachatフォルダの中身をプロジェクトルートに移動
        run: |
          if [ -d "sorachat" ]; then
            echo "sorachatフォルダが見つかりました。中身をプロジェクトルートに移動します..."
            
            shopt -s dotglob
            # sorachatの中身をルートに移動（エラーが出ても止まらないように安全に処理）
            if [ "$(ls -A sorachat)" ]; then
              mv -f sorachat/* .
              echo "移動が完了しました。"
            else
              echo "sorachatフォルダの中身が空です。"
            fi
            
            # 空になったsorachatフォルダを削除
            rm -rf sorachat
            shopt -u dotglob
          else
            echo "sorachatフォルダが存在しません。処理をスキップします。"
          fi

      - name: 変更をコミットしてプッシュ
        run: |
          git add -A
          git status
          
          # 変更差分がある場合のみコミットとプッシュを行う
          if git diff --staged --quiet; then
            echo "変更はありません。"
          else
            git commit -m "chore: move sorachat contents to root and push [skip ci]"
            git push
          fi
